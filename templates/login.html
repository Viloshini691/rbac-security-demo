{% extends "base.html" %}

{% block content %}

<div class="login-card">

    <h1>🔐 Secure Login</h1>

    <p>
        Role-Based Access Control demonstration
    </p>

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>


    <div class="demo-accounts">

        <h3>Demo Accounts</h3>

        <p>
            Admin:
            <strong>admin / Admin123!</strong>
        </p>

        <p>
            Patient:
            <strong>patient1 / Patient123!</strong>
        </p>

        <p>
            Doctor:
            <strong>doctor1 / Doctor123!</strong>
        </p>

    </div>

</div>

{% endblock %}
